[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2", "pybind11>=2.10.0", "cmake>=3.15", "ninja>=1.10"]
build-backend = "setuptools.build_meta"

[project]
name = "adaiml-tools"
dynamic = ["version"]
description = "A Python library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Artheiden", email = "artheidendureza@gmail.com"}
]
keywords = ["adaiml-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["numpy>=1.21.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "isort>=5.0",
    "mypy>=0.990",
]

[project.urls]
Homepage = "https://github.com/artheidendureza/adAI"
Documentation = "https://adAI.readthedocs.io"
Repository = "https://github.com/artheidendureza/adAI.git"
Issues = "https://github.com/artheidendureza/adAI/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/adAI --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools_scm]
version_file = "src/adAI/_version.py"

# Custom build script for C++ extension
[tool.setuptools.cmdclass]
build_ext = "cpp_backend.build_ext:BuildExt"
